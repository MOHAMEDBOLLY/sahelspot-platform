name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # The suite (see docs/TESTING.md) needs a real Postgres — it exercises
    # Postgres-specific types (JSONB, ARRAY, a partial unique index) a
    # SQLite substitute couldn't faithfully cover. Local development points
    # at the shared Supabase project for that reason, but CI has no access
    # to repo secrets for a database it doesn't own, so it gets its own
    # disposable, empty Postgres instead — real Postgres, not a fake, and
    # nothing to provision or credential. Every test's isolation is already
    # convention-based (test-prefixed ids, self-cleaning fixtures — see
    # conftest.py), not dependent on any pre-existing seed row, so this
    # empty database needs schema only (via the migrations below), not data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahelspot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Used by `alembic upgrade head` below (alembic/env.py reads
      # settings.database_url). pytest does NOT read this — see
      # TEST_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahelspot_ci
      # The only database variable pytest reads (see
      # api/tests/database_guard.py). Same disposable CI Postgres, named
      # explicitly: the guard deliberately never falls back to
      # DATABASE_URL, so a developer's production-pointing .env can never
      # reach a test run.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahelspot_ci
      # Only used to sign/verify tokens the test suite mints for itself
      # (see tests/conftest.py) — never a real Supabase secret, and never
      # used to reach a real Supabase project.
      SUPABASE_JWT_SECRET: ci-only-test-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest
      # Security hardening — pinned deps (Sprint 30) were never scanned for
      # newly-disclosed CVEs after being pinned. Currently clean (verified
      # before adding this step), so this is a real, blocking gate, not
      # just a report — a future vulnerable pin fails the build here.
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datalab-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: datalab-next/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Security hardening — reporting only, not blocking: a real
      # high-severity react-router advisory currently exists here with no
      # fix available except a breaking downgrade, which is a deliberate
      # upgrade decision out of scope for this change (see
      # docs/SECURITY.md). `continue-on-error` surfaces the finding in the
      # CI log/summary without failing builds over a known, tracked issue.
      - run: npm audit --audit-level=high
        continue-on-error: true

  consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: consumer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Security hardening — same reporting-only reasoning as the
      # `frontend` job above: current findings here are noise from
      # transitive deps bundled inside `next` itself (postcss/sharp), with
      # npm's suggested "fix" being an inappropriate downgrade to a much
      # older Next.js major version. See docs/SECURITY.md.
      - run: npm audit --audit-level=high
        continue-on-error: true

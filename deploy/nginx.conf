# SahelSpot production reverse-proxy configuration.
#
# This file is the exact configuration running in production as
# /opt/sahelspot/nginx/default.conf on the host `sahelspot-web` container
# (nginx:alpine), captured via `docker exec sahelspot-web nginx -T` and
# checked into the repo so it has a reviewable, version-controlled source
# of truth instead of existing only on the VPS.
#
# It covers all three domains this proxy serves — not just the API:
#   sahelspot.com / www.sahelspot.com  -> consumer:3000 (Next.js)
#   api.sahelspot.com                  -> sahelspot-api:8000 (FastAPI)
#   admin.sahelspot.com                -> static Studio build (SPA)
#
# History: H1 was originally designed and committed as a standalone
# catch-all server block (rate-limiting policy only, meant to be merged
# into "whatever proxy you run" per DEPLOYMENT.md). Production deployment
# required actually integrating it into the real server blocks alongside
# TLS, redirects, and the other two domains — that integration is ADR-008
# (map-based key selection over dedicated location blocks) and ADR-009
# (container-name upstream identification, replacing the network alias
# OPS-001 found broken). This file reflects that integration, not the
# original standalone draft — the two diverged during production rollout
# and this version is the one now running.
#
# To apply a change: edit this file, copy it to the host inode-preserving
# (`cat new-config > /opt/sahelspot/nginx/default.conf` — NOT `sed -i`,
# which replaces the inode and orphans the container's bind mount; see the
# OPS-001 incident), `docker exec sahelspot-web nginx -t`, then
# `docker exec sahelspot-web nginx -s reload`. See docs/DEPLOYMENT.md.

# --- H1 rate limiting (ADR-008) ----------------------------------------
# Zone keys are empty for non-matching paths; nginx skips a limit_req whose
# key evaluates empty, so each request is measured against exactly one zone
# without adding location blocks or duplicating proxy configuration.
# Keyed on $uri (normalised, query string stripped) so appending a query
# string cannot move a request out of the search zone.
map $uri $sahelspot_search_key {
    default              "";
    ~^/public/search/    $binary_remote_addr;
}

map $uri $sahelspot_public_key {
    default              $binary_remote_addr;
    ~^/public/search/    "";
    ~^/editor/           "";
}

map $uri $sahelspot_editor_key {
    default              "";
    ~^/editor/           $binary_remote_addr;
}

limit_req_zone $sahelspot_search_key zone=sahelspot_search:10m rate=5r/s;
limit_req_zone $sahelspot_public_key zone=sahelspot_public:10m rate=10r/s;
limit_req_zone $sahelspot_editor_key zone=sahelspot_editor:10m rate=30r/s;
limit_req_status 429;
# -----------------------------------------------------------------------

# HTTP: ACME challenge passthrough (matches the existing certbot renewal
# cron's webroot at /opt/sahelspot/certbot-www) + redirect everything else
# to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sahelspot.com www.sahelspot.com api.sahelspot.com admin.sahelspot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Consumer (Next.js) — sahelspot.com + www.sahelspot.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sahelspot.com www.sahelspot.com;

    ssl_certificate     /etc/letsencrypt/live/sahelspot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahelspot.com/privkey.pem;

    # Temporary Private Beta gate — nginx-layer Basic Auth only, ahead of
    # public launch. Separate htpasswd file from Admin's own gate below,
    # so beta credentials and Studio credentials stay fully independent.
    # Remove these two lines (and the .htpasswd-consumer file/mount) to
    # lift the gate at launch.
    auth_basic           "SahelSpot Private Beta";
    auth_basic_user_file /etc/nginx/.htpasswd-consumer;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        proxy_pass http://consumer:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API (FastAPI) — api.sahelspot.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sahelspot.com;

    # Same cert as the other server block — the SAN currently doesn't
    # include api.sahelspot.com yet (extended in a later step); once
    # certbot adds that SAN in place, this path needs no change.
    ssl_certificate     /etc/letsencrypt/live/sahelspot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahelspot.com/privkey.pem;

    gzip on;
    gzip_types application/json;

    client_max_body_size 10m;

    # H1 - structured 429 matching the API's error shape rather than
    # nginx's default HTML page.
    error_page 429 = @ratelimited;

    location @ratelimited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"detail":{"error":"rate_limited","message":"Too many requests. Please slow down and try again."}}';
    }

    location / {
        limit_req zone=sahelspot_search burst=15 nodelay;
        limit_req zone=sahelspot_public burst=30 nodelay;
        limit_req zone=sahelspot_editor burst=60 nodelay;

        # ADR-009: proxy_pass targets the Docker container NAME
        # (sahelspot-api), not a network alias. Docker's embedded DNS
        # resolves container names on a user-defined network without any
        # extra flag, whereas the alias this originally used
        # (`http://api:8000`) was silently dropped on a container
        # recreation and broke `nginx -t` for ~10 hours until OPS-001
        # found and fixed it. The name survives recreation by
        # construction — Docker won't allow two containers with the same
        # name to coexist, so the identifier can't be silently omitted
        # the way an optional alias flag can.
        proxy_pass http://sahelspot-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin (DataLab / SahelSpot Studio) — admin.sahelspot.com
# Two auth layers: Nginx Basic Auth (network-layer gate, first) + the
# app's own Supabase Auth login (second, inside the SPA) — per explicit
# instruction, app auth architecture itself is unchanged.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.sahelspot.com;

    ssl_certificate     /etc/letsencrypt/live/sahelspot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahelspot.com/privkey.pem;

    auth_basic           "SahelSpot Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    root /usr/share/nginx/datalab;
    index index.html;

    # SPA fallback: any path that isn't a real static file falls through
    # to index.html so client-side routing (react-router) owns it —
    # this is what makes a hard browser refresh on a deep route work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
